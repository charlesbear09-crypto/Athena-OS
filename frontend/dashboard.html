<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Athena Command Center</title>

<link rel="stylesheet" href="css/dashboard.css">
<link rel="stylesheet" href="css/sidebar.css">

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

    <button class="side-btn" data-page="ai">🤖</button>

    <button class="side-btn" data-page="finance">📈</button>

    <button class="side-btn" data-page="garage">🚘</button>

    <button class="side-btn" data-page="diagnostics">🩺</button>

</div>

<!-- Main HUD -->

<div class="hud">

<header>

<h1>ATHENA</h1>

<p>COMMAND CENTER</p>

<div id="clock"></div>

</header>

<section class="status-bar">

<div>
AI CORE
<span>ONLINE</span>
</div>

<div>
FINANCE
<span>READY</span>
</div>

<div>
GARAGE
<span>CONNECTED</span>
</div>

<div>
ACADEMY
<span>ACTIVE</span>
</div>

</section>

<nav>

<button>🤖 AI CORE</button>

<button>📈 FINANCE</button>

<button>🚘 GARAGE</button>

<button>🎓 ACADEMY</button>

<main>

<div class="card">

<h2>🤖 ATHENA</h2>

<p>System Intelligence</p>

<h3>ONLINE</h3>

</div>

<div class="card">

<h2>📈 FINANCE</h2>

<p>Paper Portfolio</p>

<h3>$10,000</h3>

</div>

<div class="card">

<h2>🚘 GARAGE</h2>

<p>2004 Silverado 1500</p>

<h3>CONNECTED</h3>

</div>

<div class="card">

<h2>🎓 ACADEMY</h2>

<p>Cybersecurity Path</p>

<h3>LEVEL 1</h3>

</div>

</main>

</div>

<script src="js/router.js"></script>
<script src="js/system.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/sidebar.js"></script>

</body>

</html>
